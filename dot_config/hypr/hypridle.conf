# -----------------------------------------------------------------------------------------------------------------------------------------
# hypridle is Hyprland’s idle management daemon.
# https://wiki.hyprland.org/Hypr-Ecosystem/hypridle/
# -----------------------------------------------------------------------------------------------------------------------------------------

general {
    # ignore_dbus_inhibit = false
    lock_cmd = pidof hyprlock || hyprlock --grace 3    # avoid starting multiple hyprlock instances.
    # TODO : Are those commands really needed ?
    # before_sleep_cmd = logger -t hypridle-debug -p user.debug "Before sleep command" && loginctl lock-session           # lock before suspend.
    # after_sleep_cmd = logger -t hypridle-debug -p user.debug "After sleep command" && hyprctl dispatch "hl.dsp.dpms({ action = 'enable' })" && brightnessctl -r  # to avoid having to press a key twice to turn on the display.
}

# Dim screen
listener {
    # timeout = 540
    timeout = 540
    on-timeout = logger -t hypridle-debug -p user.debug "Dimming screen" && brightnessctl -s set 60   # Set brightness to 15% and save state.
    on-resume = logger -t hypridle-debug -p user.debug "Restore screen brightness" && brightnessctl -r           # Restore previous brightness on activity.
}

# Dim keyboard
listener {
    timeout = 540
    on-timeout = logger -t hypridle-debug -p user.debug "Dimming keyboard" && brightnessctl -sd '*kbd_backlight*' set 0  # Set keyboard backlight off.
    on-resume = logger -t hypridle-debug -p user.debug "Restore keyboard birghtness" && brightnessctl -rd '*kbd_backlight*'         # turn on keyboard backlight.
}

# Screenlock
listener {
    timeout = 600
    on-timeout = logger -t hypridle-debug -p user.debug "Locking screen" && loginctl lock-session
}

# Turn screen off
listener {
    timeout = 660
    on-timeout = logger -t hypridle-debug -p user.debug "Turning screen off" && hyprctl dispatch "hl.dsp.dpms({ action = 'disable' })"
    on-resume = logger -t hypridle-debug -p user.debug "Restoring screen on" && hyprctl dispatch "hl.dsp.dpms({ action = 'enable' })" && brightnessctl -r && brightnessctl -rd '*kbd_backlight*'
}

# Suspend
listener {
    timeout = 1800
    on-timeout = logger -t hypridle-debug -p user.debug "Suspending" && systemctl suspend
}
