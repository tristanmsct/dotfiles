# -----------------------------------------------------------------------------------------------------------------------------------------
# hypridle is Hyprland’s idle management daemon.
# https://wiki.hyprland.org/Hypr-Ecosystem/hypridle/
# -----------------------------------------------------------------------------------------------------------------------------------------

general {
    # ignore_dbus_inhibit = false
    lock_cmd = pidof hyprlock || hyprlock --grace 3    # avoid starting multiple hyprlock instances.
    before_sleep_cmd = loginctl lock-session           # lock before suspend.
    after_sleep_cmd = hyprctl dispatch dpms on         # to avoid having to press a key twice to turn on the display.
}

# Dim screen
listener {
    timeout = 540
    on-timeout = brightnessctl -s set 60   # Set brightness to 15% and save state.
    on-resume = brightnessctl -r           # Restore previous brightness on activity.
}

# Dim keyboard
listener {
    timeout = 540
    on-timeout = brightnessctl -sd '*kbd_backlight*' set 0  # turn off keyboard backlight.
    on-resume = brightnessctl -rd '*kbd_backlight*'         # turn on keyboard backlight.
}

# Screenlock
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# Turn screen off
listener {
    timeout = 660
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on && brightnessctl -r
}

# Suspend
listener {
    timeout = 1800
    on-timeout = systemctl suspend-then-hibernate
}
