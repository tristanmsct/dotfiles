$HYPRCONF = $HOME/.config/hypr/conf

# ---------------------------------------------------------------------------------------
# Monitor
# ---------------------------------------------------------------------------------------
# For Hyprsplit
exec-once = hyprpm reload -n
source = $HYPRCONF/monitor.conf

# For IIO
exec-once = iio-sensor-proxy & iio-hyprland

# ---------------------------------------------------------------------------------------
# Cursor
# ---------------------------------------------------------------------------------------
source = $HYPRCONF/cursor.conf

# ---------------------------------------------------------------------------------------
# Keyboard
# ---------------------------------------------------------------------------------------
source = $HYPRCONF/keyboard.conf

# ---------------------------------------------------------------------------------------
# Load pywal color file
# ---------------------------------------------------------------------------------------
source = $HOME/.cache/wal/colors-hyprland.conf

# ---------------------------------------------------------------------------------------
# Autostart
# ---------------------------------------------------------------------------------------
source = $HYPRCONF/autostart.conf

# ---------------------------------------------------------------------------------------
# Load configuration files
# ---------------------------------------------------------------------------------------
source = $HYPRCONF/windows.conf
source = $HYPRCONF/decorations.conf
source = $HYPRCONF/layout.conf
source = $HYPRCONF/misc.conf
source = $HYPRCONF/keybinding.conf
source = $HYPRCONF/touch-gestures.conf
source = $HYPRCONF/layer-rules.conf
source = $HYPRCONF/window-rules.conf
source = $HYPRCONF/environment.conf
source = $HYPRCONF/animations.conf

# ---------------------------------------------------------------------------------------
# Environment for xdg-desktop-portal-hyprland
# ---------------------------------------------------------------------------------------
exec-once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
