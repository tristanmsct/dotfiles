$HYPRSCRIPTS = $HOME/.config/hypr/scripts
$HYPRLAUNCHERS = $HOME/.config/hypr/launchers

# Clean Home Directory / Set up state
exec-once = $HYPRSCRIPTS/system/setup-state.sh
exec-once = $HYPRSCRIPTS/system/home-cleaner.sh

# Clean games
exec-once = $HYPRSCRIPTS/game-mode/cleanup-games.sh

# Setup XDG for screen sharing
exec-once = $HYPRSCRIPTS/system/xdg.sh

# Setup monitor configuration
# This will also restore the wallpaper and start waybar.
exec-once = $HYPRSCRIPTS/monitors/monitor-check.sh
exec-once = $HYPRSCRIPTS/monitors/monitor-handler.sh

# Start Polkit
# Gnome polkit is not supported anymore. If it stops working, switch to hyprpolkitagent.
# For now, gnome polkit is just much better.
exec-once=/usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
# exec-once = systemctl --user start hyprpolkitagent

# Start Gnome-Keyring
exec-once = gnome-keyring-daemon --start --components=secrets,ssh

# Load Dunst Notification Manager
exec-once = dunst

# Start EWW daemon
exec-once = eww daemon

# Using hypridle to start hyprlock
exec-once = hypridle

# Load cliphist history
exec-once = wl-paste --watch cliphist store

# Start Hyprsunset
# exec-once = $HYPRSCRIPTS/hyprsunset/hyprsunset.sh restore

# Restore Game Mode
exec-once = $HYPRSCRIPTS/game-mode/restore.sh

# Start Nextcloud
exec-once = $HYPRLAUNCHERS/nextcloud.sh --background

# Check VPN status
exec-once = $HYPRSCRIPTS/vpn/update-status.sh

# SDL version
env = SDL_VIDEODRIVER,wayland
