windowrule = prop opaque, class:^(brave-browser)$
windowrule = prop opaque, class:^(Brave-browser)$
windowrule = prop opaque, class:^(vlc)$

windowrule = tile, class:^(Brave-browser)$
windowrule = float, class:^(pavucontrol)$
windowrule = float, class:^(blueman-manager)$
windowrule = float, class:^(dotfiles-floating)$
windowrule = float, class:^(qalculate-gtk)$

# Browser Picture in Picture
windowrule = float, title:^([Pp]icture[\s\-]in[\s\-][Pp]icture)$
windowrule = pin, title:^([Pp]icture[\s\-]in[\s\-][Pp]icture)$
windowrule = size 50% 50%, title:^([Pp]icture[\s\-]in[\s\-][Pp]icture)$
windowrule = move 50% 40%, title:^([Pp]icture[\s\-]in[\s\-][Pp]icture)$

# Pavucontrol floating
windowrule = float, class:(.*org.pulseaudio.pavucontrol.*)
windowrule = size 860 600, class:(.*org.pulseaudio.pavucontrol.*)
windowrule = center, class:(.*org.pulseaudio.pavucontrol.*)
windowrule = pin, class:(.*org.pulseaudio.pavucontrol.*)

# Waypaper floating
windowrule = float, class:(.*waypaper.*)
windowrule = size 900 700, class:(.*waypaper.*)
windowrule = center, class:(.*waypaper.*)
windowrule = pin, class:(.*waypaper.*)

# Systemupdate floating
windowrule = float, title:(systemupdate)

# Gnome Calculator
windowrule = float, class:(org.gnome.Calculator)
windowrule = size 700 600, class:(org.gnome.Calculator)
windowrule = center, class:(org.gnome.Calculator)

# Gnome Calendar
windowrule = float, class:(org.gnome.Calendar)
windowrule = size 25% 10%, class:(org.gnome.Calendar)
windowrule = center, class:(org.gnome.Calendar)
windowrule = move 37% 28%, class:(org.gnome.Calendar)

# Sushi
windowrule = float, class:(org.gnome.NautilusPreviewer)
windowrule = size 1300 900, class:(org.gnome.NautilusPreviewer)
windowrule = center, class:(org.gnome.NautilusPreviewer)

# Emoji Picker Smile
windowrule = float, class:(it.mijorus.smile)
windowrule = pin, class:(it.mijorus.smile)
windowrule = move 100%-w-40 90, class:(it.mijorus.smile)

# Mission Center
windowrule = prop opaque, class:(io.missioncenter.MissionCenter)

# Download and save windows
windowrule = float, class:^(xdg-desktop-portal-gtk)$
windowrule = size 1000 700, class:^(xdg-desktop-portal-gtk)$

# Folder and file picker windows
windowrule = float, title:^(Select Folder)$
windowrule = size 1000 700, title:^(Select Folder)$
windowrule = float, title:^(Open File)$
windowrule = size 1000 700, title:^(Open File)$

# Nextcloud
windowrule = float, class:^(com.nextcloud.desktopclient.nextcloud)$
windowrule = size 700 800, class:^(com.nextcloud.desktopclient.nextcloud)$
windowrule = move 1200 70, class:^(com.nextcloud.desktopclient.nextcloud)$, title:^(Nextcloud Settings)$
windowrule = move 1170 100, class:^(com.nextcloud.desktopclient.nextcloud)$, title:^(Nextcloud)$

# Bitwarden
# windowrule = float, title:^(Bitwarden)$  # Does not work for some reason
windowrule = float, class:^(brave-nn.*-Default)$
windowrule = size 500 700, class:^(brave-nn.*-Default)$
windowrule = move 1400 70, class:^(brave-nn.*-Default)$

# XDG Desktop Portal
env = XDG_CURRENT_DESKTOP, Hyprland
env = XDG_SESSION_TYPE, wayland
env = XDG_SESSION_DESKTOP, Hyprland

# QT
env = QT_QPA_PLATFORM, wayland;xcb
env = QT_QPA_PLATFORMTHEME, qt6ct
# env = QT_QPA_PLATFORMTHEME, qt5ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION, 1
env = QT_AUTO_SCREEN_SCALE_FACTOR, 1

# Set the cursor size for xcursor
env = XCURSOR_SIZE, 40
env = XCURSOR_THEME, Vimix-white-cursors

# GDK
env = GDK_SCALE, 1

# Toolkit Backend
env = GDK_BACKEND, wayland, x11, *
env = CLUTTER_BACKEND, wayland

# Disable appimage launcher by default
env = APPIMAGELAUNCHER_DISABLE, 1

# Ozone
env = OZONE_PLATFORM, wayland
env = ELECTRON_OZONE_PLATFORM_HINT, wayland
