# SUPER KEY
$mainMod = SUPER
$SCRIPTS = $HOME/.local/bin
$HYPRSCRIPTS = $HOME/.config/hypr/scripts
$HYPRSETTINGS = $HOME/.config/hypr/settings

$TYPORA_FILE=$HOME/Nextcloud/03-Notes/Day-to-day/"$(date '+%Y-%m-%d')"-notes.md

# Applications
bind = $mainMod, RETURN, exec, $HYPRSETTINGS/terminal.sh # Open Kitty terminal
bind = $mainMod SHIFT, RETURN, exec, [float;size 800 400;move 1000 100] $HYPRSETTINGS/terminal.sh # Open Kitty terminal as a scratchpad
bind = $mainMod, B, exec, $HYPRSETTINGS/browser.sh # Open Brave web browser
bind = $mainMod, A, exec, $HYPRSETTINGS/ai.sh # Open Claude LLM
bind = $mainMod, E, exec, $HYPRSETTINGS/filemanager.sh # Open the filemanager
bind = $mainMod SHIFT, E, exec, $HYPRSETTINGS/filemanager.sh -s /home/tristan/Nextcloud/04-Collectives/Computers/Linux # Open the filemanager in collectives
bind = $mainMod, N, exec, $HYPRSETTINGS/typora.sh $TYPORA_FILE # Open typora with todays notes
bind = $mainMod SHIFT, N, exec, [float;size 800 400;move 1000 100] $HYPRSETTINGS/typora.sh $TYPORA_FILE # Open typora with todays notes as a scratchpad
bind = $mainMod CTRL, N, exec, $HYPRSETTINGS/typora.sh $HOME/Nextcloud/04-Collectives # Open typora with collectives
bind = $mainMod, S, exec, subl # Open Sublime Text
bind = $mainMod, X, exec, $HYPRSETTINGS/codium.sh # Open VSCodium
bind = $mainMod CTRL, E, exec, $HYPRSETTINGS/emojipicker.sh # Open the emoji picker
bind = $mainMod, G, exec, steam # Open Steam

# Windows
bind = $mainMod, Q, killactive # Kill active window
bind = $mainMod, F, fullscreen # Set active window to fullscreen
bind = $mainMod, T, togglefloating # Toggle active windows into floating mode
bind = $mainMod SHIFT, T, exec, $HYPRSCRIPTS/workspaces/all-float.sh # Toggle all windows into floating mode
bind = $mainMod, J, togglesplit # Toggle split
bind = $mainMod, left, movefocus, l # Move focus left
bind = $mainMod, right, movefocus, r # Move focus right
bind = $mainMod, up, movefocus, u # Move focus up
bind = $mainMod, down, movefocus, d # Move focus down
bindm = $mainMod, mouse:272, movewindow # Move window with the mouse

bindm = $mainMod, mouse:273, resizewindow # Resize window with the mouse
bind = $mainMod SHIFT, right, resizeactive, 100 0 # Increase window width with keyboard
bind = $mainMod SHIFT, left, resizeactive, -100 0 # Reduce window width with keyboard
bind = $mainMod SHIFT, down, resizeactive, 0 100 # Increase window height with keyboard
bind = $mainMod SHIFT, up, resizeactive, 0 -100 # Reduce window height with keyboard
bind = $mainMod ALT, G, togglegroup # Toggle window group
bind = $mainMod, K, swapsplit # Swapsplit

# Actions
bind = $mainMod SHIFT, R, exec, $HYPRSCRIPTS/system/loadconfig.sh # Reload hyprland config

bind = $mainMod CTRL, V, exec, $HYPRSCRIPTS/menus/cliphist.sh # Open clipboard manager
bind = $mainMod CTRL, K, exec, $HYPRSCRIPTS/menus/keybindings.sh # Show keybindings
bind = $mainMod CTRL, RETURN, exec, pkill rofi || rofi -show drun -replace -i -disable-history # Open application launcher

bind = CTRL, Escape, exec, hyprlock # Open screenlock
bind = $mainMod, L, exec, hyprlock # Open screenlock
bind  = , XF86PowerOff, exec, wlogout -b 2 # Open logout menu
bind = $mainMod CTRL, Q, exec, wlogout -b 2 # Open logout menu

bind = $mainMod, PRINT, exec, $HYPRSCRIPTS/menus/screenshot.sh # Take a screenshot
bind = $mainMod SHIFT, S, exec, $HYPRSCRIPTS/menus/screenshot.sh # Take a screenshot

bind = $mainMod, W, exec, waypaper # Open wallpaper selector
bind = $mainMod SHIFT, W, exec, waypaper --random # Change the wallpaper
bind = $mainMod CTRL, W, exec, waypaper --restore # Waypaper restore

bind = $mainMod SHIFT, B, exec, $HYPRSCRIPTS/waybar/launch.sh # Reload waybar
bind = $mainMod CTRL, B, exec, $HYPRSCRIPTS/waybar/toggle.sh # Toggle waybar
bind = $mainMod CTRL, G, exec, $HYPRSCRIPTS/game-mode/activate.sh # Toggle game mode
bind = $mainMod SHIFT, G, exec, rofi -modi games -show games -theme games # Open game launcher

bind = $mainMod, H, exec, $HYPRSCRIPTS/hyprsunset/hyprsunset.sh # Toggle Hyprsunset
bind = $mainMod SHIFT, H, exec, $HYPRSCRIPTS/menus/hyprsunset.sh temperature-setter # Open Hyprsunset menu
bind = $mainMod CTRL, H, exec, $HYPRSCRIPTS/menus/hyprsunset.sh autotimer-switch # Open Hyprsunset auto timer menu

bind = $mainMod, P, exec, $HYPRSCRIPTS/menus/monitor-menu.sh # Launch monitor configuration menu
bind = $mainMod SHIFT, P, exec, $HYPRSCRIPTS/monitors/monitor-check.sh # Auto-detect monitor configuration
bind = $mainMod CTRL, F, exec, $HYPRSCRIPTS/media/audio-helper.sh # Connect audio device, fix already connected ones
bind = $mainMod CTRL, S, exec, $HYPRSCRIPTS/menus/brightness-menu.sh # Open brightness menu

bind = $mainMod, V, exec, $HYPRSCRIPTS/menus/vpn.sh # Open the VPN menu

bind = $mainMod, C, exec, $HYPRSCRIPTS/menus/accent-color.sh # Open the accent color menu
bind = $mainMod SHIFT, C, exec, $HYPRSCRIPTS/menus/saturation.sh # Open the saturation menu
bind = $mainMod CTRL, C, exec, hyprpicker -a
bind = $mainMod SHIFT, L, exec, $HYPRSCRIPTS/theming/switch-theme.sh # Switch between light and dark theme

bind = $mainMod, U, exec, $HYPRSCRIPTS/cava/cava-overlay.sh # Start and stop the Cava background overlay
bind = $mainMod SHIFT, U, exec, $HYPRSCRIPTS/cava/cava-overlay.sh mini # Start and stop the Cava bottom right mini overlay
bind = $mainMod CTRL, U, exec, $HYPRSCRIPTS/cava/cava-overlay.sh mini title # Start and stop the Cava bottom right mini overlay + media title
bind = $mainMod, I, exec, $HYPRSCRIPTS/game-mode/clock-overlay.sh # Start and stop the clock background overlay

# Workspaces
# The main config for monitors is dependent on the screen config (multi or mono screen)
# So the main binds are in the corresponding conf/monitor/mowqno.conf and multi.conf
# hyprlang noerror true
bind = $mainMod, D, split:swapactiveworkspaces, current +1
bind = $mainMod, R, split:grabroguewindows
# hyprlang noerror true

bind = $mainMod, Z, exec, $HYPRSCRIPTS/workspaces/move-to-empty.sh # Send the active window to the next empty workpace
bind = $mainMod CTRL, Z, exec, python $HYPRSCRIPTS/workspaces/compact_workspaces.py # Compact all windows in adjacent workspaces without gaps

bind = $mainMod, Tab, workspace, m+1 # Open next workspace
bind = $mainMod SHIFT, Tab, workspace, m-1 # Open previous workspace

bind = $mainMod, mouse_down, workspace, e+1 # Open next workspace
bind = $mainMod, mouse_up, workspace, e-1 # Open previous workspace
bind = $mainMod CTRL, down, workspace, empty # Open the next empty workspace

bind = $mainMod CTRL, ampersand, exec, $HYPRSCRIPTS/workspaces/move-to.sh 1 # Move all windows to workspace 1
bind = $mainMod CTRL, eacute, exec, $HYPRSCRIPTS/workspaces/move-to.sh 2 # Move all windows to workspace 2
bind = $mainMod CTRL, quotedbl, exec, $HYPRSCRIPTS/workspaces/move-to.sh 3 # Move all windows to workspace 3
bind = $mainMod CTRL, apostrophe, exec, $HYPRSCRIPTS/workspaces/move-to.sh 4 # Move all windows to workspace 4
bind = $mainMod CTRL, parenleft, exec, $HYPRSCRIPTS/workspaces/move-to.sh 5 # Move all windows to workspace 5
bind = $mainMod CTRL, minus, exec, $HYPRSCRIPTS/workspaces/move-to.sh 6 # Move all windows to workspace 6
bind = $mainMod CTRL, egrave, exec, $HYPRSCRIPTS/workspaces/move-to.sh 7 # Move all windows to workspace 7
bind = $mainMod CTRL, underscore, exec, $HYPRSCRIPTS/workspaces/move-to.sh 8 # Move all windows to workspace 8
bind = $mainMod CTRL, ccedilla, exec, $HYPRSCRIPTS/workspaces/move-to.sh 9 # Move all windows to workspace 9
bind = $mainMod CTRL, agrave, exec, $HYPRSCRIPTS/workspaces/move-to.sh 10 # Move all windows to workspace 10

# Passthrough SUPER KEY to Virtual Machine
# bind = $mainMod, P, submap, passthru # Passthrough SUPER key to virtual machine
# submap = passthru
# bind = SUPER, Escape, submap, reset # Get SUPER key back from virtual machine
# submap = reset

# Fn keys
bind = , XF86MonBrightnessUp, exec, brightnessctl -q s +10% # Increase brightness by 10%
bind = , XF86MonBrightnessDown, exec, brightnessctl -q s 10%- # Reduce brightness by 10%
bind = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +5% # Increase volume by 5%
bind = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -5% # Reduce volume by 5%
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle # Toggle mute
bind = , XF86AudioPlay, exec, playerctl play-pause # Audio play pause
bind = , XF86AudioPause, exec, playerctl pause # Audio pause
bind = , XF86AudioNext, exec, playerctl next # Audio next
bind = , XF86AudioPrev, exec, playerctl previous # Audio previous
bind = , XF86AudioMicMute, exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle # Toggle microphone
bind = , XF86Calculator, exec, $HYPRSETTINGS/calculator.sh # Open calculator
bind = , XF86Lock, exec, hyprlock # Open screenlock
# bind = , XF86Tools, exec,

bind = , code:238, exec, brightnessctl -d smc::kbd_backlight s +10
bind = , code:237, exec, brightnessctl -d smc::kbd_backlight s 10-

bind = , gesture swipe up 3, exec, brave

# Tests

# bind = $mainMod, O, exec, dunstify "Test" # Reserved for test
bind = $mainMod, O, exec, $HYPRSCRIPTS/game-mode/clock-overlay.sh # Reserved for test
